version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - /00-remote-state-stack
      - /01-network-stack
      - /02-security-stack
      - /03-compute-stack
      - /modules/ec2_instance
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
